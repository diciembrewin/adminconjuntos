<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>
TuCasaAlDía | Información y consejos para el hogar
</title>

<meta name="description"
      content="TuCasaAlDía ofrece información general sobre administración del hogar, limpieza de casas, mantenimiento, organización y cuidado de viviendas.">

<meta name="robots"
      content="index, follow">

<meta name="author"
      content="TuCasaAlDía">

<link rel="canonical"
      href="https://tucasaaldiajelpit.vercel.app/">

<style>

/* =====================================================
   CONFIGURACIÓN GENERAL
===================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    background: #f7f8fa;
    color: #172033;

    line-height: 1.6;
}

body.no-scroll {
    overflow: hidden;
}

a {
    color: inherit;
    text-decoration: none;
}

button {
    font: inherit;
}

:root {
    --primary: #3156d3;
    --primary-dark: #2444b3;
    --primary-light: #eef2ff;

    --text: #172033;
    --muted: #667085;

    --white: #ffffff;

    --border: #e5e7eb;

    --dark: #121a2a;

    --max-width: 1160px;

    --radius: 18px;
}


/* =====================================================
   CONTENEDOR
===================================================== */

.container {
    width: min(
        calc(100% - 40px),
        var(--max-width)
    );

    margin: 0 auto;
}


/* =====================================================
   HEADER
===================================================== */

.header {
    position: sticky;

    top: 0;

    z-index: 100;

    background:
        rgba(255,255,255,.97);

    border-bottom:
        1px solid var(--border);

    backdrop-filter:
        blur(10px);
}

.header-inner {
    min-height: 72px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 30px;
}

.logo {
    display: flex;

    align-items: center;

    gap: 10px;

    font-size: 20px;

    font-weight: 800;

    white-space: nowrap;
}

.logo-icon {
    width: 39px;
    height: 39px;

    display: flex;

    align-items: center;
    justify-content: center;

    background:
        var(--primary);

    color: white;

    border-radius: 11px;

    font-size: 20px;
}

.logo span {
    color: var(--primary);
}


/* =====================================================
   NAV
===================================================== */

.nav {
    display: flex;

    align-items: center;

    gap: 27px;
}

.nav a {
    color: #566174;

    font-size: 14px;

    font-weight: 600;

    transition: .2s;
}

.nav a:hover {
    color: var(--primary);
}

.menu-button {
    display: none;

    width: 42px;
    height: 42px;

    border:
        1px solid var(--border);

    background:
        white;

    border-radius: 10px;

    cursor: pointer;

    color: var(--text);
}


/* =====================================================
   HERO
===================================================== */

.hero {
    background:
        white;

    border-bottom:
        1px solid var(--border);
}

.hero-content {
    min-height: 510px;

    display: grid;

    grid-template-columns:
        1.1fr .9fr;

    align-items: center;

    gap: 70px;

    padding:
        75px 0;
}

.hero-label {
    display: inline-flex;

    align-items: center;

    gap: 8px;

    padding:
        7px 12px;

    margin-bottom: 20px;

    background:
        var(--primary-light);

    color:
        var(--primary);

    border-radius:
        30px;

    font-size: 12px;

    font-weight: 800;
}

.hero-label i {
    width: 7px;
    height: 7px;

    background:
        var(--primary);

    border-radius: 50%;
}

.hero h1 {
    max-width: 700px;

    font-size:
        clamp(40px,5vw,64px);

    line-height:
        1.06;

    letter-spacing:
        -2.5px;

    margin-bottom: 22px;
}

.hero h1 span {
    color:
        var(--primary);
}

.hero-text {
    max-width: 620px;

    color:
        var(--muted);

    font-size: 18px;

    margin-bottom: 30px;
}

.hero-actions {
    display: flex;

    flex-wrap: wrap;

    gap: 12px;
}

.button {
    min-height: 48px;

    display: inline-flex;

    align-items: center;

    justify-content: center;

    padding:
        0 21px;

    border-radius: 11px;

    font-size: 14px;

    font-weight: 700;

    cursor: pointer;

    border:
        1px solid transparent;
}

.button-primary {
    background:
        var(--primary);

    color:
        white;
}

.button-primary:hover {
    background:
        var(--primary-dark);
}

.button-secondary {
    background:
        white;

    color:
        var(--text);

    border-color:
        var(--border);
}


/* =====================================================
   ILUSTRACIÓN
===================================================== */

.hero-card {
    min-height: 365px;

    display: flex;

    align-items: center;

    justify-content: center;

    overflow: hidden;

    border-radius: 28px;

    background:
        linear-gradient(
            145deg,
            #eef2ff,
            #f8fafc
        );

    border:
        1px solid #e1e6f4;
}

.house {
    position: relative;

    width: 210px;
    height: 170px;

    background:
        white;

    border-radius:
        14px 14px 10px 10px;

    box-shadow:
        0 25px 60px
        rgba(40,57,100,.12);
}

.roof {
    position: absolute;

    left: -20px;

    top: -75px;

    width: 250px;

    height: 150px;

    background:
        var(--primary);

    transform:
        rotate(45deg);

    border-radius:
        20px;
}

.door {
    position: absolute;

    left: 83px;

    bottom: 0;

    width: 46px;

    height: 78px;

    background:
        #26344f;

    border-radius:
        8px 8px 0 0;
}

.window {
    position: absolute;

    top: 45px;

    width: 42px;

    height: 42px;

    background:
        #dbeafe;

    border:
        5px solid #26344f;

    border-radius: 7px;
}

.window-one {
    left: 25px;
}

.window-two {
    right: 25px;
}


/* =====================================================
   AVISO INFORMATIVO
===================================================== */

.notice {
    padding:
        18px 0;
}

.notice-box {
    display: flex;

    gap: 15px;

    padding:
        18px 20px;

    background:
        white;

    border:
        1px solid var(--border);

    border-radius:
        14px;
}

.notice-icon {
    width: 36px;
    height: 36px;

    flex-shrink: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    background:
        #f1f5f9;

    color:
        var(--primary);

    border-radius:
        10px;

    font-weight:
        800;
}

.notice strong {
    display: block;

    font-size: 14px;

    margin-bottom: 2px;
}

.notice p {
    color:
        var(--muted);

    font-size: 13px;
}


/* =====================================================
   SECCIONES
===================================================== */

.section {
    padding:
        80px 0;
}

.section-header {
    max-width: 720px;

    margin-bottom:
        38px;
}

.section-tag {
    display: inline-block;

    padding:
        6px 11px;

    margin-bottom:
        12px;

    background:
        var(--primary-light);

    color:
        var(--primary);

    border-radius:
        30px;

    font-size: 11px;

    font-weight:
        800;

    letter-spacing:
        .5px;
}

.section h2 {
    font-size:
        clamp(30px,4vw,43px);

    line-height:
        1.15;

    letter-spacing:
        -1.3px;

    margin-bottom:
        10px;
}

.section-header p {
    color:
        var(--muted);
}


/* =====================================================
   TARJETAS
===================================================== */

.cards {
    display: grid;

    grid-template-columns:
        repeat(3,1fr);

    gap: 18px;
}

.card {
    padding:
        27px;

    background:
        white;

    border:
        1px solid var(--border);

    border-radius:
        var(--radius);

    transition:
        .25s;
}

.card:hover {
    transform:
        translateY(-5px);

    box-shadow:
        0 18px 45px
        rgba(20,30,60,.07);
}

.card-icon {
    width: 48px;
    height: 48px;

    display: flex;

    align-items: center;
    justify-content: center;

    margin-bottom:
        20px;

    background:
        var(--primary-light);

    color:
        var(--primary);

    border-radius:
        13px;

    font-size:
        20px;
}

.card h3 {
    font-size:
        18px;

    margin-bottom:
        9px;
}

.card p {
    color:
        var(--muted);

    font-size:
        14px;
}


/* =====================================================
   ARTÍCULOS
===================================================== */

.articles {
    background:
        white;

    border-top:
        1px solid var(--border);

    border-bottom:
        1px solid var(--border);
}

.article-grid {
    display: grid;

    grid-template-columns:
        repeat(3,1fr);

    gap: 20px;
}

.article {
    overflow:
        hidden;

    background:
        white;

    border:
        1px solid var(--border);

    border-radius:
        var(--radius);
}

.article-top {
    height: 125px;

    display: flex;

    align-items: center;

    justify-content: center;

    background:
        linear-gradient(
            135deg,
            #eef2ff,
            #f8fafc
        );

    color:
        var(--primary);

    font-size:
        34px;
}

.article-body {
    padding:
        23px;
}

.article-label {
    margin-bottom:
        7px;

    color:
        var(--primary);

    font-size:
        11px;

    font-weight:
        800;

    text-transform:
        uppercase;
}

.article h3 {
    font-size:
        18px;

    line-height:
        1.35;

    margin-bottom:
        8px;
}

.article p {
    color:
        var(--muted);

    font-size:
        14px;
}


/* =====================================================
   TEMAS
===================================================== */

.topic-section {
    background:
        #f7f8fa;
}

.topic-content {
    display: grid;

    grid-template-columns:
        repeat(2,1fr);

    gap: 20px;
}

.topic-box {
    padding:
        28px;

    background:
        white;

    border:
        1px solid var(--border);

    border-radius:
        var(--radius);
}

.topic-box h3 {
    margin-bottom:
        10px;

    font-size:
        19px;
}

.topic-box p {
    color:
        var(--muted);

    font-size:
        14px;

    line-height:
        1.75;
}


/* =====================================================
   SOBRE NOSOTROS
===================================================== */

.about {
    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap:
        60px;

    align-items:
        center;
}

.about-text p {
    color:
        var(--muted);

    margin-bottom:
        17px;

    font-size:
        15px;
}

.about-list {
    padding:
        28px;

    background:
        white;

    border:
        1px solid var(--border);

    border-radius:
        var(--radius);
}

.about-item {
    display:
        flex;

    gap:
        14px;

    padding:
        15px 0;

    border-bottom:
        1px solid var(--border);
}

.about-item:last-child {
    border-bottom:
        none;
}

.check {
    width: 29px;
    height: 29px;

    flex-shrink:
        0;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    background:
        var(--primary-light);

    color:
        var(--primary);

    border-radius:
        8px;

    font-weight:
        800;
}

.about-item strong {
    display:
        block;

    margin-bottom:
        3px;
}

.about-item span {
    color:
        var(--muted);

    font-size:
        13px;
}


/* =====================================================
   CONTACTO
===================================================== */

.contact {
    background:
        var(--dark);

    color:
        white;
}

.contact-inner {
    display:
        grid;

    grid-template-columns:
        1fr 1fr;

    gap:
        60px;

    align-items:
        center;
}

.contact h2 {
    color:
        white;
}

.contact p {
    max-width:
        540px;

    color:
        #aeb7c8;
}

.contact-box {
    padding:
        28px;

    background:
        rgba(255,255,255,.06);

    border:
        1px solid
        rgba(255,255,255,.1);

    border-radius:
        var(--radius);
}

.contact-row {
    display:
        flex;

    gap:
        14px;

    padding:
        15px 0;

    border-bottom:
        1px solid
        rgba(255,255,255,.09);
}

.contact-row:last-child {
    border-bottom:
        none;
}

.contact-row strong {
    display:
        block;

    margin-bottom:
        2px;
}

.contact-row span {
    color:
        #aeb7c8;

    font-size:
        13px;
}


/* =====================================================
   FOOTER
===================================================== */

footer {
    padding:
        35px 0;

    background:
        #0d1421;

    color:
        #8993a5;
}

.footer-top {
    display:
        flex;

    justify-content:
        space-between;

    gap:
        40px;

    padding-bottom:
        28px;

    border-bottom:
        1px solid
        rgba(255,255,255,.08);
}

.footer-brand {
    max-width:
        370px;
}

.footer-brand .logo {
    color:
        white;

    margin-bottom:
        12px;
}

.footer-brand p {
    font-size:
        13px;
}

.footer-links {
    display:
        flex;

    gap:
        70px;
}

.footer-links h4 {
    margin-bottom:
        12px;

    color:
        white;

    font-size:
        12px;
}

.footer-links a,
.footer-links button {
    display:
        block;

    margin-bottom:
        8px;

    padding:
        0;

    border:
        none;

    background:
        transparent;

    color:
        #8993a5;

    cursor:
        pointer;

    font-size:
        13px;

    text-align:
        left;
}

.footer-links a:hover,
.footer-links button:hover {
    color:
        white;
}

.footer-bottom {
    display:
        flex;

    justify-content:
        space-between;

    gap:
        20px;

    padding-top:
        22px;

    font-size:
        12px;
}


/* =====================================================
   MODALES
===================================================== */

.modal-bg {
    position:
        fixed;

    inset:
        0;

    z-index:
        500;

    display:
        none;

    align-items:
        center;

    justify-content:
        center;

    padding:
        20px;

    background:
        rgba(15,23,42,.65);
}

.modal-bg.active {
    display:
        flex;
}

.modal {
    width:
        min(680px,100%);

    max-height:
        85vh;

    overflow-y:
        auto;

    background:
        white;

    border-radius:
        20px;
}

.modal-header {
    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

    padding:
        22px 25px;

    border-bottom:
        1px solid var(--border);
}

.modal-close {
    width:
        36px;

    height:
        36px;

    border:
        none;

    background:
        #f1f5f9;

    border-radius:
        9px;

    cursor:
        pointer;

    font-size:
        20px;
}

.modal-content {
    padding:
        25px;

    color:
        var(--muted);

    font-size:
        14px;
}

.modal-content h4 {
    margin:
        20px 0 7px;

    color:
        var(--text);
}

.modal-content h4:first-child {
    margin-top:
        0;
}


/* =====================================================
   COOKIES
===================================================== */

.cookie-banner {
    position:
        fixed;

    left:
        20px;

    right:
        20px;

    bottom:
        20px;

    z-index:
        1000;

    display:
        none;

    max-width:
        1080px;

    margin:
        auto;

    padding:
        20px;

    background:
        white;

    border:
        1px solid #dfe3eb;

    border-radius:
        18px;

    box-shadow:
        0 20px 60px
        rgba(15,23,42,.18);
}

.cookie-banner.show {
    display:
        block;
}

.cookie-content {
    display:
        flex;

    align-items:
        center;

    gap:
        20px;
}

.cookie-icon {
    width:
        45px;

    height:
        45px;

    flex-shrink:
        0;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    background:
        var(--primary-light);

    border-radius:
        12px;

    font-size:
        22px;
}

.cookie-text {
    flex:
        1;
}

.cookie-text h3 {
    margin-bottom:
        4px;

    font-size:
        16px;
}

.cookie-text p {
    color:
        var(--muted);

    font-size:
        13px;
}

.cookie-text a {
    color:
        var(--primary);

    text-decoration:
        underline;
}

.cookie-actions {
    display:
        flex;

    gap:
        8px;

    flex-shrink:
        0;
}

.cookie-button {
    min-height:
        42px;

    padding:
        0 15px;

    background:
        white;

    border:
        1px solid var(--border);

    border-radius:
        9px;

    cursor:
        pointer;

    font-size:
        13px;

    font-weight:
        700;
}

.cookie-button.primary {
    background:
        var(--primary);

    color:
        white;

    border-color:
        var(--primary);
}


/* =====================================================
   PANEL COOKIES
===================================================== */

.cookie-settings {
    position:
        fixed;

    inset:
        0;

    z-index:
        1100;

    display:
        none;

    align-items:
        center;

    justify-content:
        center;

    padding:
        20px;

    background:
        rgba(15,23,42,.65);
}

.cookie-settings.show {
    display:
        flex;
}

.cookie-panel {
    width:
        min(620px,100%);

    max-height:
        90vh;

    overflow-y:
        auto;

    background:
        white;

    border-radius:
        20px;
}

.cookie-panel-header {
    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

    padding:
        22px 25px;

    border-bottom:
        1px solid var(--border);
}

.cookie-panel-close {
    width:
        36px;

    height:
        36px;

    border:
        none;

    background:
        #f1f5f9;

    border-radius:
        9px;

    cursor:
        pointer;

    font-size:
        20px;
}

.cookie-panel-body {
    padding:
        25px;
}

.cookie-intro {
    margin-bottom:
        20px;

    color:
        var(--muted);

    font-size:
        14px;
}

.cookie-category {
    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

    gap:
        20px;

    padding:
        17px 0;

    border-bottom:
        1px solid var(--border);
}

.cookie-category h4 {
    font-size:
        14px;
}

.cookie-category p {
    max-width:
        450px;

    color:
        var(--muted);

    font-size:
        12px;
}

.cookie-status {
    color:
        var(--primary);

    font-size:
        11px;

    font-weight:
        800;

    white-space:
        nowrap;
}

.cookie-toggle {
    position:
        relative;

    width:
        45px;

    height:
        25px;

    flex-shrink:
        0;
}

.cookie-toggle input {
    opacity:
        0;

    width:
        0;

    height:
        0;
}

.cookie-slider {
    position:
        absolute;

    inset:
        0;

    background:
        #cbd2df;

    border-radius:
        30px;

    cursor:
        pointer;
}

.cookie-slider::before {
    content:
        "";

    position:
        absolute;

    left:
        3px;

    top:
        3px;

    width:
        19px;

    height:
        19px;

    background:
        white;

    border-radius:
        50%;

    transition:
        .2s;
}

.cookie-toggle input:checked
+ .cookie-slider {
    background:
        var(--primary);
}

.cookie-toggle input:checked
+ .cookie-slider::before {
    transform:
        translateX(20px);
}

.cookie-panel-footer {
    display:
        flex;

    justify-content:
        flex-end;

    gap:
        9px;

    padding:
        18px 25px;

    border-top:
        1px solid var(--border);
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media (max-width: 900px) {

    .nav {
        position:
            absolute;

        top:
            72px;

        left:
            0;

        right:
            0;

        display:
            none;

        flex-direction:
            column;

        align-items:
            stretch;

        gap:
            0;

        padding:
            12px 20px;

        background:
            white;

        border-bottom:
            1px solid var(--border);
    }

    .nav.active {
        display:
            flex;
    }

    .nav a {
        padding:
            13px 5px;
    }

    .menu-button {
        display:
            block;
    }

    .hero-content {
        grid-template-columns:
            1fr;

        gap:
            40px;
    }

    .cards,
    .article-grid {
        grid-template-columns:
            1fr 1fr;
    }

    .about,
    .contact-inner {
        grid-template-columns:
            1fr;
    }

    .footer-top {
        flex-direction:
